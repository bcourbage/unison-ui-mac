name: unison-ui-mac
options:
  bundleIdPrefix: net.courbage
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "23"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: NO
    OCAMLLIBDIR: ${OCAMLLIBDIR}
    UNISON_SRC: ${UNISON_SRC}
    STRIPPED_ASMRUN_DIR: ${STRIPPED_ASMRUN_DIR}
    # Absolute path to the OCaml object the Swift app links against.
    # Set by the Makefile to either the vendored blob (default) or the
    # freshly-built upstream blob when BLOB is overridden on the
    # command line. See the BLOB / VENDORED_BLOB / UPSTREAM_BLOB
    # mechanics in Makefile.
    BLOB: ${BLOB}

packages:
  # Sparkle 2 — in-app software updates. Pinned by REVISION, not tag, so a
  # moved `2.9.6` tag (e.g. after an upstream account compromise) cannot swap
  # the framework underneath us: SPM resolves this exact commit, whose
  # Package.swift declares the binary xcframework's checksum. The revision below
  # is tag 2.9.6. (Package.resolved lives inside the gitignored .xcodeproj, so
  # the revision pin here is the tracked lock.) Bump deliberately — see
  # docs/sparkle-updates.md — the same discipline as the vendored OCaml blob.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ac2def288cbff5cfc7df3ffef6abdf45b72bcb0a

targets:
  unison-ui-mac:
    type: application
    platform: macOS
    preBuildScripts:
      # Fail loudly if the OCaml engine object isn't wired up, instead of
      # linking a broken bundle that crashes at launch with undefined
      # caml_* symbols. BLOB is baked in by `xcodegen generate` (see the
      # Makefile's `export BLOB`); if it's empty here the project was
      # generated without it — build via `make build`.
      - name: Check OCaml blob is linked
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${BLOB}" ] || [ ! -f "${BLOB}" ]; then
            echo "error: OCaml engine object not found (BLOB='${BLOB}'). Build with 'make build', which generates the Xcode project and runtime libs. See README → Build and install." >&2
            exit 1
          fi
          if [ ! -f "${STRIPPED_ASMRUN_DIR}/libasmrun_nomain.a" ]; then
            echo "error: stripped OCaml runtime not found in STRIPPED_ASMRUN_DIR='${STRIPPED_ASMRUN_DIR}'. Run 'make build' to generate it. See README → Build and install." >&2
            exit 1
          fi
    sources:
      - path: Sources/App
        # Never let a stray build/coverage artifact in the source dir leak into
        # the .app bundle: xcodegen globs this directory wholesale, and an
        # untracked `default.profraw` (LLVM coverage output from `make test`)
        # was otherwise copied into Contents/Resources of a local package.
        excludes:
          - "**/*.profraw"
      - path: Sources/Bridge
      # Native Icon Composer app icon (macOS 26 Liquid Glass). Carries the light
      # gradient plus dark/tinted appearance variants natively, so the OS renders
      # the right variant on EVERY surface — Finder, Dock, About — on macOS 26+,
      # and falls back to the light rendering on macOS < 26. actool compiles it
      # (a standalone `.icon` package, sibling to any catalog) into Assets.car +
      # an .icns fallback; selected via ASSETCATALOG_COMPILER_APPICON_NAME /
      # CFBundleIconName below. No runtime icon-swapping is needed.
      - path: Resources/Unison.icon
      # The rendered Unison reference manual. Lives in vendor/ rather
      # than Resources/ because it's a generated artifact (hevea →
      # `make vendor-manual`) versioned alongside the OCaml blob. Xcode
      # copies it into the .app bundle's Resources at build time;
      # AppDelegate.openUnisonProjectHelp(_:) opens it via NSWorkspace.
      # Version comes from ${UNISON_VERSION} (exported by the Makefile) so this
      # stays in lockstep with VENDORED_MANUAL rather than drifting on an engine
      # bump. Generate via `make xcodeproj` (or `make build`), which exports it —
      # a bare `xcodegen generate` can't inherit the Makefile default and fails on
      # the unset variable, so export UNISON_VERSION first if you run xcodegen by hand.
      - path: vendor/unison-manual-${UNISON_VERSION}.html
        buildPhase: resources
      # GPLv3 §5 obligation: a conveyed copy must "give all recipients
      # a copy of this License along with the Program." When the .app
      # is distributed standalone (zipped on GitHub Releases, for
      # example), the LICENSE + NOTICE files inside the repo aren't
      # along for the ride — they have to live inside the bundle. We
      # copy both into Resources/ so anyone Show-Package-Contents-ing
      # the .app finds them at Contents/Resources/LICENSE and
      # Contents/Resources/NOTICE.md.
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      # Sparkle framework (declared in the top-level `packages` block).
      # Xcode links and auto-embeds the SPM binary framework into the app.
      - package: Sparkle
      # The `unison` command-line launcher, copied into Contents/MacOS next to
      # the app executable. It is what a PATH symlink named `unison` points at
      # (cask `binary` stanza or manual link); see docs/cli-launcher-design.md.
      # sign-app.sh requires and signs it; verify-bundle-minos.sh holds it to the
      # deployment target like every binary in Contents/MacOS.
      - target: cltool
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Resources/Info.plist
      properties:
        # Version strings — must be listed here, not just in Resources/Info.plist,
        # because xcodegen regenerates the plist on every `make build` and falls
        # back to "1.0" / "1" defaults for any version keys absent from this
        # block. Substitution variables resolve at xcodebuild time against the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION declared in `settings.base`.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Icon comes from the native Icon Composer Unison.icon (compiled by
        # actool). CFBundleIconName selects it; the OS renders light/dark/tinted
        # variants natively on macOS 26+, with a light fallback on <26.
        CFBundleIconName: Unison
        CFBundleName: Unison-UI-Mac
        CFBundleDisplayName: Unison-UI-Mac
        # Shows in Finder's Get Info → "More info...". Short form by
        # convention; the full GPLv3 grant + upstream attribution
        # chain live in LICENSE + NOTICE.md.
        NSHumanReadableCopyright: "Copyright © 2026 Bruno Courbage. Licensed under GNU GPLv3 or later. Embeds Unison File Synchronizer © Benjamin C. Pierce and contributors."
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle in-app updater. These MUST be declared here, not only in
        # Resources/Info.plist, because xcodegen regenerates the plist on every
        # build (same reason as the version strings above).
        #   SUFeedURL              — appcast location (HTTPS). Points at the
        #                            updates.courbage.net Cloudflare Worker, a
        #                            transparent proxy that logs the anonymous
        #                            update-check profile and fetches the GitHub
        #                            Pages appcast, returning it BYTE-FOR-BYTE (feed
        #                            signature intact). GitHub Pages remains the
        #                            signed origin (first published with v0.5.0);
        #                            builds released before this change poll it
        #                            directly. Local testing uses a local appcast
        #                            without touching either (see
        #                            docs/sparkle-updates.md).
        #   SUPublicEDKey          — Sparkle's EdDSA (ed25519) PUBLIC key; the
        #                            REAL key. Its private half's canonical copy
        #                            is in the maintainer's login keychain, and a
        #                            copy also exists as the gated `release`
        #                            environment secret SPARKLE_ED_PRIVATE_KEY;
        #                            neither belongs in repo contents. NOT a
        #                            placeholder — it changes only on a key
        #                            rotation, which the current one-key pipeline
        #                            does NOT support in-band; on compromise, the
        #                            recovery is manual reinstallation (see the
        #                            "Key rotation" section of docs/sparkle-updates.md).
        #                            Sparkle's validator accepts an
        #                            update when EITHER a valid EdDSA archive
        #                            signature OR a matching Apple Developer ID
        #                            signature is present (an OR, not both). The
        #                            Release build is Developer ID-signed and
        #                            notarized, so both branches are live; EdDSA
        #                            stays mandatory on the publish path regardless
        #                            — see docs/sparkle-updates.md.
        #   SUVerifyUpdateBeforeExtraction — verify the archive's EdDSA
        #                            signature BEFORE handing it to the
        #                            unarchiver. Without it Sparkle extracts an
        #                            unauthenticated archive first (in the
        #                            unsandboxed Installer XPC service) and only
        #                            checks the signature afterward, so a
        #                            compromised feed serving a malicious archive
        #                            reaches the unarchiver before the sole
        #                            author-controlled trust check. Required here,
        #                            and a hard prerequisite of SURequireSignedFeed
        #                            below.
        #   SUEnableSystemProfiling — send an anonymous system/app profile (OS
        #                            version, CPU, Mac model, RAM, app version,
        #                            language) as query parameters on the update
        #                            check, at most once per week.
        #   SUPromptUserOnFirstLaunch — ask about automatic checks on the FIRST
        #                            launch (Sparkle otherwise defers the prompt to
        #                            the second launch). That prompt carries an
        #                            "Include anonymous system profile" checkbox
        #                            that is checked by default, so profiling is
        #                            opt-OUT within the prompt. Nothing is sent
        #                            until the user answers. Details + rationale in
        #                            docs/sparkle-updates.md.
        # SUEnableAutomaticChecks is deliberately unset: the first-launch prompt
        # above is what turns automatic checks on or off.
        # SURequireSignedFeed authenticates the appcast FEED ITSELF (a feed-level
        # Ed25519 signature in a trailing "<!-- sparkle-signatures: -->" block),
        # on top of the per-archive edSignature. generate_appcast emits that feed
        # signature automatically because this key is true in the app bundle it
        # archives, using the same maintainer key. It REQUIRES
        # SUVerifyUpdateBeforeExtraction=true (below) or the updater refuses to
        # start. Safe to enable with the FIRST Sparkle release: there are no prior
        # update-checking clients to break, and the release pipeline publishes a
        # signed feed. Enabling it once clients exist, before the feed is signed,
        # would break every update check. Sparkle can otherwise RECOVER into
        # unsigned-feed handling after continuous feed-signature failures for
        # SUSignedFeedFailureExpirationInterval seconds (default 1,728,000 = 20
        # days), a key-rotation escape hatch that also fails open. Set it to 0,
        # which the pinned 2.9.6 source treats as "never recover", so feed-level
        # enforcement stays permanently fail-closed. Because 0 removes Sparkle's
        # automatic recovery, EdDSA key rotation is NOT supported by the current
        # one-key pipeline — see docs/sparkle-updates.md ("Key rotation") before
        # ever changing SUPublicEDKey or the SPARKLE_ED_PRIVATE_KEY secret.
        SURequireSignedFeed: true
        SUSignedFeedFailureExpirationInterval: 0
        SUFeedURL: https://updates.courbage.net/unison-ui-mac/appcast.xml
        SUPublicEDKey: /jLGv/pL0qFJOHFm/kpxONcqkeo8KOBH+oxDLTuCwt8=
        SUVerifyUpdateBeforeExtraction: true
        SUEnableSystemProfiling: true
        SUPromptUserOnFirstLaunch: true
        # No storyboard / nib — the menu is wired programmatically in main.swift.
        NSMainNibFile: ""
    settings:
      base:
        PRODUCT_NAME: unison-ui-mac
        PRODUCT_BUNDLE_IDENTIFIER: net.courbage.unison-ui-mac
        INFOPLIST_FILE: Resources/Info.plist
        # actool needs to know which asset-catalog set is the app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: Unison
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/UnisonBridgeC.h
        HEADER_SEARCH_PATHS:
          - $(OCAMLLIBDIR)
          - $(SRCROOT)/Sources/Bridge
        # NOTE: not inheriting — Xcode's Debug config defines DEBUG=1, which
        # activates CAMLassert macros that reference caml_failed_assert (only
        # present in OCaml's debug runtime libasmrund.a, which we don't link).
        # We therefore can't use DEBUG to gate test-only C; UNISON_DEBUG_HOOKS
        # (Debug-config only, below) plays that role for the reaper test reset.
        GCC_PREPROCESSOR_DEFINITIONS:
          - CAML_NAME_SPACE=1
        # $(OCAMLLIBDIR) supplies libthreadsnat/libunixnat/libcamlstrnat directly;
        # $(STRIPPED_ASMRUN_DIR) supplies the main-stripped libasmrun_nomain. All
        # four are built for the deployment target by the OCaml install itself
        # (Makefile SF7 + verify-runtime-minos), so no per-lib copy is needed.
        LIBRARY_SEARCH_PATHS:
          - $(OCAMLLIBDIR)
          - $(STRIPPED_ASMRUN_DIR)
        OTHER_LDFLAGS:
          - $(BLOB)
          - -lasmrun_nomain
          - -lthreadsnat
          - -lunixnat
          - -lcamlstrnat
          - -lpthread
      configs:
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS:
            - CAML_NAME_SPACE=1
            - UNISON_DEBUG_HOOKS=1

  # The `unison` launcher. A plain C command-line tool that resolves the app
  # executable next to it and execs it with the caller's arguments unchanged.
  # Embedded into the app bundle by the dependency above; never shipped on its
  # own. Tested without Xcode by scripts/test-cltool.sh (`make check-cltool`).
  cltool:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLTool
    dependencies:
      # LSCopyApplicationURLsForBundleIdentifier, the bundle-identifier fallback.
      - sdk: CoreServices.framework
    settings:
      base:
        PRODUCT_NAME: cltool
        # A tool has no Info.plist; make sure Xcode does not synthesize one.
        GENERATE_INFOPLIST_FILE: NO

  unison-ui-macTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: unison-ui-mac
    settings:
      base:
        PRODUCT_NAME: unison-ui-macTests
        PRODUCT_BUNDLE_IDENTIFIER: net.courbage.unison-ui-macTests
        # Tests link into the running app process (TEST_HOST below), so the
        # OCaml runtime is already initialized by AppDelegate.applicationDidFinishLaunching.
        # No need to re-link blob.o or libasmrun here.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/unison-ui-mac.app/Contents/MacOS/unison-ui-mac
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

# Release pipeline, split into three jobs so production code-signing can never be
# reached from an arbitrary ref, and so the exact bytes we sign are the exact
# bytes proven to run on the macOS deployment floor:
#
#   build        — runs for every trigger (a v* tag push, or a manual dispatch of
#                  any branch/SHA). Builds + tests + packages the app UNSIGNED and
#                  uploads it as an artifact. Sees NO signing/notary secrets and
#                  holds a read-only token. The safe "dry-run" build check.
#   smoke-macos15 — runs on macos-15, downloads the build artifact and LAUNCHES it
#                  on the deployment-floor OS (exercising the exact executable +
#                  OCaml runtime bytes). Gates the release job (SF7): a build that
#                  cannot run on macOS 15 blocks publication.
#   release      — runs ONLY on a pushed v* tag, gated by the `release` GitHub
#                  Environment (required reviewers + a v* tag deployment rule) AND
#                  by smoke-macos15. Only this job reads the Developer ID / notary
#                  secrets and holds a write token. It SIGNS THE SAME ARTIFACT the
#                  smoke job validated (it does not rebuild), then notarizes and
#                  publishes — so signing + notarization + publishing are reachable
#                  solely through the protected tag path, with human approval.
#
# build runs on macos-26, pinned to Xcode 26.6 (build 17F113): the native Icon
# Composer app icon (Resources/Unison.icon) only compiles under Xcode 26's
# actool, verified fail-closed below. The OCaml runtime is built for macOS 15
# there (MACOSX_DEPLOYMENT_TARGET exported before setup-ocaml), never relabelled.
#
# Normal release: bump BOTH MARKETING_VERSION and CURRENT_PROJECT_VERSION in
# project.yml (the build number must strictly increase — Sparkle compares it, and
# the appcast step enforces it), update CHANGELOG, commit, then
# `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`.
# Dry-run build check: Actions ▸ Run workflow ▸ optionally name a branch/SHA.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build UNSIGNED as a dry-run check. Signed releases come only from pushing a v* tag."
        required: false
        default: ""

# Least privilege by default; the release job elevates its own token.
permissions:
  contents: read

# Serialize with the product-site deploy (pages.yml shares this group): both push
# the gh-pages branch, and a release's appcast publish must never race a site
# deploy. cancel-in-progress: false so neither is killed mid-publish — they queue.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

# SF11: XcodeGen pinned + checksum-verified via the single authority
# scripts/install-xcodegen.sh (in lockstep with ci.yml and vendor-blob.yml) so a
# floating tool can't change the generated .xcodeproj / Resources/Info.plist on
# the signed release path. The signature covers whatever project.yml generated,
# so the generator must be reproducible.

jobs:
  build:
    name: Build check (unsigned)
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      # The dispatch input is consumed ONLY as an actions/checkout `ref:` input
      # (an expression, not shell), so it cannot inject into a run step.
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Select and verify Xcode 26.6 (fail closed)
        run: |
          dev="/Applications/Xcode_26.6.app/Contents/Developer"
          [ -d "$dev" ] || { echo "::error::Xcode 26.6 not found at $dev"; exit 1; }
          sudo xcode-select -s "$dev"
          ver="$(xcodebuild -version)"; echo "$ver"
          echo "$ver" | grep -qx "Xcode 26.6"           || { echo "::error::expected Xcode 26.6"; exit 1; }
          echo "$ver" | grep -qx "Build version 17F113" || { echo "::error::expected build 17F113"; exit 1; }

      - name: Untap aws/tap (runner-image noise)
        run: brew untap aws/tap || true

      # SF7: export the deployment target BEFORE setup-ocaml so the OCaml runtime
      # is GENUINELY built for macOS 15 on this macOS-26 host (post-15 APIs
      # weak-imported, not strongly bound against SDK 26). No relabelling; the app
      # links a real minos-15 runtime, asserted by verify-runtime-minos.
      - name: Export macOS deployment target (from project.yml) for the OCaml build
        run: |
          target="$(awk '/deploymentTarget:/{f=1} f&&/macOS:/{gsub(/[" ]/,""); split($0,a,":"); print a[2]; exit}' project.yml)"
          [ -n "$target" ] || { echo "::error::could not read deploymentTarget macOS from project.yml"; exit 1; }
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"
          echo "OCaml runtime will be built for macOS $target"

      - name: Set up OCaml 5.5.0 (pinned)
        uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: "5.5.0"
          # Bust any switch cached before the deployment target was pinned.
          cache-prefix: "v2-macos-deploy-target"
      - name: Put the pinned OCaml switch on PATH
        run: echo "$(opam var bin)" >> "$GITHUB_PATH"
      - name: Verify pinned OCaml
        run: |
          ocamlc -version
          test "$(ocamlc -version)" = "5.5.0"

      - name: Install pinned + SHA-256-verified XcodeGen
        # SF11: single authority for the pinned version + checksum (not a floating
        # `brew install`) so the generated .xcodeproj / Resources/Info.plist are
        # reproducible on the release path. Same script ci.yml and vendor-blob.yml use.
        run: ./scripts/install-xcodegen.sh

      - name: Run tests
        run: make test

      - name: Build (Release configuration, unsigned)
        # This runner is macos-26 with the newer OCaml — the exact SF7 scenario.
        # Fail on any deployment-version linker warning so a runtime object built
        # for a newer macOS than the baseline can never silently ship.
        run: |
          set -o pipefail
          make build CONFIG=Release 2>&1 | tee build.log
          if grep -q "was built for newer" build.log; then
            echo "::error::deployment-version linker warnings present in the Release build (SF7)"
            grep "was built for newer" build.log | sort -u | head
            exit 1
          fi

      - name: Verify macOS deployment baseline (unsigned Release bundle)
        # The exact bytes about to be packaged: our own binaries == the deployment
        # target, nothing (incl. Sparkle) exceeds it. Signing/notarization don't
        # change a Mach-O's minos, so verifying here proves the floor for the
        # product the signed release job builds from the same recipe.
        run: make verify-bundle-minos CONFIG=Release

      - name: Verify Info.plist critical values (generated + unsigned Release app)
        # Fail-closed check of the Sparkle security keys, bundle id, executable,
        # min-os, and version/build against project.yml. Early detection on the
        # unsigned bytes; the release job re-runs the built-app check against the
        # SIGNED + stapled bundle before publication (signing does not alter these
        # Info.plist values, but the final bytes are what ship, so both are checked).
        run: |
          make check-plist-keys
          ./scripts/verify-plist-keys.sh --app .build/derived/Build/Products/Release/unison-ui-mac.app

      - name: Package unsigned build (for inspection)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          app=".build/derived/Build/Products/Release/unison-ui-mac.app"
          test -d "$app" || { echo "::error::built app not found at $app"; exit 1; }
          # Name off the immutable run id — never off a user-supplied ref (which
          # could contain '/'). Passed via env, not interpolated into the body.
          zip="unison-ui-mac-unsigned-${RUN_ID}.app.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          shasum -a 256 "$zip"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unison-ui-mac-unsigned-${{ github.run_id }}
          path: ${{ env.ZIP }}
          retention-days: 7

  # SF7: run the EXACT release-built application on the macOS deployment floor
  # before anything is published. The build job compiles on macOS 26 (needed for
  # Xcode 26's Icon Composer actool); this job downloads that build's app artifact
  # and launches it on macos-15, exercising the same executable + OCaml runtime
  # bytes that will subsequently be signed and shipped. Signing does not change a
  # Mach-O's load behaviour or deployment target, so validating the unsigned
  # artifact establishes macOS-15 compatibility for the release. If a post-15 API
  # were bound against the newer SDK, dyld would fail at load here and the release
  # would be blocked (the `release` job `needs` this job).
  smoke-macos15:
    name: macOS 15 launch smoke (release build)
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out (for the verifier script)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Show runner macOS version
        run: sw_vers

      - name: Download the unsigned release build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unison-ui-mac-unsigned-${{ github.run_id }}
          path: dl

      - name: Unpack the app
        run: |
          zip="$(find dl -name '*.app.zip' | head -1)"
          [ -n "$zip" ] || { echo "::error::no .app.zip in the downloaded artifact"; exit 1; }
          /usr/bin/ditto -x -k "$zip" unpacked
          app="$(find unpacked -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$app" ] || { echo "::error::no .app in the unpacked artifact"; exit 1; }
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"
          echo "unpacked: $app"

      - name: Verify the release bundle's macOS floor (exact release bytes)
        run: ./scripts/verify-bundle-minos.sh "$APP"

      - name: Launch on macOS 15 and require a clean exit
        # Runs the release-built binary directly (not via `open`) so the process
        # exit code is observable. UNISON_UI_SMOKE makes the app initialise the
        # OCaml runtime + engine (unison_bridge_startup + init0), show the picker,
        # then terminate cleanly; Sparkle is skipped under that flag. A load-time
        # failure from a post-15 symbol, or any crash during engine init, exits
        # nonzero and fails the release. macOS has no `timeout(1)`, so guard with a
        # background launch + poll; a hang (e.g. an unexpected modal) also fails.
        run: |
          bin="$APP/Contents/MacOS/unison-ui-mac"
          test -x "$bin" || { echo "::error::main executable missing at $bin"; exit 1; }
          work="$RUNNER_TEMP/smoke"; mkdir -p "$work/unison"
          UNISON="$work/unison" UNISON_UI_SMOKE=1 "$bin" > "$work/out.log" 2>&1 &
          pid=$!
          exited=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then exited=1; break; fi
            sleep 1
          done
          if [ "$exited" -ne 1 ]; then
            echo "::error::app did not exit within 60s on macOS 15 (hang) — killing"
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
            sed -n '1,80p' "$work/out.log" || true
            exit 1
          fi
          wait "$pid"; rc=$?
          echo "app exit code on macOS 15: $rc"
          sed -n '1,80p' "$work/out.log" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::release build exited nonzero ($rc) on macOS 15 — deployment-floor compatibility not established"
            exit 1
          fi
          echo "Release build launched and exited cleanly on macOS 15."

  release:
    name: Sign, notarize, publish
    needs: [build, smoke-macos15]
    # Only a pushed v* tag reaches this job; the `release` environment adds
    # required-reviewer approval and a v* tag deployment rule on top.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve version from the tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A Git tag name is attacker-controllable (e.g. 'v1.2.3$(cmd)' is a
          # valid ref). Pass it in via env so it is DATA in a shell variable,
          # never rendered into the script body where it could inject.
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}

      - name: Select and verify Xcode 26.6 (fail closed)
        run: |
          dev="/Applications/Xcode_26.6.app/Contents/Developer"
          [ -d "$dev" ] || { echo "::error::Xcode 26.6 not found at $dev"; exit 1; }
          sudo xcode-select -s "$dev"
          ver="$(xcodebuild -version)"; echo "$ver"
          echo "$ver" | grep -qx "Xcode 26.6"           || { echo "::error::expected Xcode 26.6"; exit 1; }
          echo "$ver" | grep -qx "Build version 17F113" || { echo "::error::expected build 17F113"; exit 1; }

      - name: Untap aws/tap (runner-image noise)
        run: brew untap aws/tap || true

      - name: Verify the tag matches MARKETING_VERSION
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mv=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$mv" != "$VERSION" ]; then
            echo "::error::tag version $VERSION != project.yml MARKETING_VERSION $mv"
            exit 1
          fi

      # SF7: this job does NOT rebuild. It signs the EXACT app the build job
      # produced and the smoke-macos15 job launched on the baseline OS — so the
      # bytes shipped to users are the same bytes whose macOS-15 compatibility was
      # established. (Signing replaces signatures; it does not touch a Mach-O's
      # deployment target or load behaviour.) No OCaml/XcodeGen/Xcode build tooling
      # is needed here as a result.
      - name: Download the smoke-validated app artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unison-ui-mac-unsigned-${{ github.run_id }}
          path: dl

      - name: Unpack it to the Release products path
        run: |
          zip="$(find dl -name '*.app.zip' | head -1)"
          [ -n "$zip" ] || { echo "::error::no .app.zip in the downloaded artifact"; exit 1; }
          dest=".build/derived/Build/Products/Release"
          mkdir -p "$dest"
          /usr/bin/ditto -x -k "$zip" "$dest"
          app="$dest/unison-ui-mac.app"
          test -d "$app" || { echo "::error::unpacked app not found at $app"; exit 1; }
          echo "Unpacked the build job's artifact to $app (will be signed as-is)."

      - name: Import Developer ID signing certificate
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Signing identities visible to codesign:"
          security find-identity -v -p codesigning

      - name: Sign (Developer ID, hardened runtime, inside-out)
        run: ./scripts/sign-app.sh ".build/derived/Build/Products/Release/unison-ui-mac.app"

      - name: Notarize and staple
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          app=".build/derived/Build/Products/Release/unison-ui-mac.app"
          key="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$key"
          key_id="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          issuer="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          echo "$issuer" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' \
            || { echo "::error::ASC_ISSUER_ID is not a valid UUID (issuer and key-id may be swapped)"; exit 1; }
          zip="$RUNNER_TEMP/notarize.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$zip"
          out="$(xcrun notarytool submit "$zip" --key "$key" --key-id "$key_id" --issuer "$issuer" --wait --output-format json)"
          echo "$out"
          id="$(echo "$out" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          status="$(echo "$out" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status"
            xcrun notarytool log "$id" --key "$key" --key-id "$key_id" --issuer "$issuer" || true
            rm -f "$key"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Package the stapled .app
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          app=".build/derived/Build/Products/Release/unison-ui-mac.app"
          test -d "$app" || { echo "::error::built app not found at $app"; exit 1; }
          codesign --verify --deep --strict "$app"
          spctl -a -vvv --type exec "$app"
          # SF7: verify the EXACT signed + notarized + stapled bundle carries the
          # macOS baseline floor before it is zipped and published — the "exact
          # signed package" guarantee, on the literal bytes shipped to users.
          ./scripts/verify-bundle-minos.sh "$app"
          # Re-run the critical Info.plist assertions against the SAME signed +
          # stapled bytes (Sparkle security keys, bundle id, executable, min-os,
          # version/build) vs project.yml — so the shipped feed URL, EdDSA key,
          # and signed-feed enforcement can never regress into a release.
          ./scripts/verify-plist-keys.sh --app "$app"
          zip="unison-ui-mac-${VERSION}.app.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "Built $zip"
          shasum -a 256 "$zip"

      - name: Resolve release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          v="$VERSION"
          approved="release-notes/${v}.md"
          if [ -s "$approved" ]; then
            cp "$approved" notes.md
            echo "Using approved release notes: $approved"
          else
            awk -v ver="$v" '
              $0 ~ ("^## \\[" ver "\\]") {f=1; next}
              /^## \[/ {f=0}
              f
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "Release $v." > notes.md
              echo "::warning::no approved notes and no CHANGELOG section for $v — using a stub note."
            fi
          fi

      - name: Fetch the Sparkle tools (checksum-pinned)
        env:
          SPARKLE_VERSION: "2.9.6"
          # Keep in lockstep with docs/sparkle-updates.md and the project.yml
          # revision pin; recompute on a Sparkle bump in the same commit.
          SPARKLE_SHA256: "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
        run: |
          tools="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$tools"
          curl -fL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"
          test -x "$tools/bin/generate_appcast" || { echo "::error::generate_appcast missing from tarball"; exit 1; }
          echo "SPARKLE_BIN=$tools/bin" >> "$GITHUB_ENV"

      - name: Authenticate the seed feed and check build monotonicity
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY secret is empty"; exit 1; }
          # The ONLY release allowed to start a fresh feed (a seed 404). Every
          # later tag must find and authenticate the published feed, so a Pages
          # deletion, routing mistake, or transient 404 fails closed instead of
          # silently truncating the feed and bypassing seed auth + monotonicity.
          FIRST_SPARKLE_TAG="v0.5.0"
          work="$RUNNER_TEMP/appcast"; mkdir -p "$work"
          feedurl="https://bcourbage.github.io/unison-ui-mac/appcast.xml"
          # New build number == CFBundleVersion == the item's sparkle:version.
          build=$(grep -E '^\s*CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          case "$build" in ''|*[!0-9]*) echo "::error::CURRENT_PROJECT_VERSION '$build' is not a positive integer"; exit 1;; esac
          echo "New build number: $build"
          # Seed from the published feed so older versions survive — but the
          # signer must not bless attacker-controlled carried-forward metadata, so
          # AUTHENTICATE the seed's feed-level signature before reusing it.
          code=$(curl -sS -o "$work/seed.xml" -w '%{http_code}' "$feedurl" || echo 000)
          if [ "$code" = "404" ]; then
            if [ "$TAG" != "$FIRST_SPARKLE_TAG" ]; then
              echo "::error::feed 404 for $TAG, but only $FIRST_SPARKLE_TAG may start a fresh feed. A later 404 means the published feed is missing — refusing to truncate history."; exit 1
            fi
            echo "First Sparkle release ($TAG); starting a fresh feed."
            rm -f "$work/seed.xml"
          elif [ "$code" = "200" ]; then
            echo "Authenticating the published seed feed before reuse..."
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 scripts/verify-appcast.py "$work/seed.xml" --feed-only
            # Build must strictly exceed every version already in the (now
            # authenticated) feed, or installed clients won't treat this as newer.
            maxbuild=$(grep -oE 'sparkle:version="[0-9]+"|<sparkle:version>[0-9]+' "$work/seed.xml" | grep -oE '[0-9]+' | sort -n | tail -1)
            maxbuild="${maxbuild:-0}"
            echo "Greatest build already published: $maxbuild"
            if [ "$build" -le "$maxbuild" ]; then
              echo "::error::build $build must exceed the published feed's max $maxbuild"; exit 1
            fi
            cp "$work/seed.xml" "$work/appcast.xml"
          else
            echo "::error::unexpected HTTP $code fetching $feedurl"; exit 1
          fi

      - name: Generate, sign, and verify the appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          REPO: ${{ github.repository }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          work="$RUNNER_TEMP/appcast"
          prefix="https://github.com/${REPO}/releases/download/"
          # The new archive (exact-named) and its embedded "What's New" fragment,
          # converted from the same notes.md used for the GitHub Release body.
          cp "$ZIP" "$work/"
          python3 scripts/release-notes-to-html.py notes.md > "$work/unison-ui-mac-${VERSION}.app.html"
          # generate_appcast emits BOTH the per-enclosure edSignature and the
          # feed-level signature (the archived app carries SURequireSignedFeed),
          # using the same key. Private key on stdin, never argv; strip newlines.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | tr -d '\r\n' | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "${prefix}${TAG}/" \
            -o "$work/appcast.xml" \
            "$work"
          # Gate 1 — structural (enclosure shape/location/qualified-name), via
          # xmllint name() semantics; committed-fixture-tested.
          ./scripts/verify-appcast-signatures.sh "$work/appcast.xml"
          # Gate 2 — cryptographic, via Sparkle's OWN sign_update (no third-party
          # crypto lib, no reimplemented signature-block parse): the feed-level
          # signature authenticates the whole feed body (so carried-forward items
          # are covered), and the NEW archive's signature verifies over its bytes,
          # matched by its EXACT expected Releases URL — so a foreign/duplicate
          # enclosure or a dot-segment URL cannot stand in for it.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 scripts/verify-appcast.py \
            "$work/appcast.xml" --archive "$work/${ZIP}" --expected-url "${prefix}${TAG}/${ZIP}"
          echo "APPCAST_PATH=$work/appcast.xml" >> "$GITHUB_ENV"

      # Only NOW, after every signing/generation/verification gate has passed, is
      # anything made public — so a key/seed/monotonicity/generator failure never
      # leaves a public "latest" release pointing at an absent or stale feed.
      - name: Create / update the GitHub Release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its asset."
            gh release upload "$TAG" "$ZIP" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file notes.md
          fi

      - name: Publish the appcast to GitHub Pages
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          pages="$RUNNER_TEMP/pages"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # gh-pages is a prerequisite (created during setup). Fail loudly rather
          # than silently reconstructing it — a botched reconstruct once published
          # the whole repo tree.
          git clone --branch gh-pages --depth 1 "$url" "$pages" \
            || { echo "::error::gh-pages branch missing; create it before releasing"; exit 1; }
          cp "$APPCAST_PATH" "$pages/appcast.xml"
          git -C "$pages" config user.name "github-actions[bot]"
          git -C "$pages" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages" add appcast.xml
          # Gate — release publication preserves all website files. The product
          # site shares this gh-pages host; a release must publish ONLY the feed
          # and leave every site file untouched. Prove it: the staged change set
          # is exactly appcast.xml (or empty). Anything else fails the release.
          staged="$(git -C "$pages" diff --cached --name-only)"
          if [ -n "$staged" ] && [ "$staged" != "appcast.xml" ]; then
            echo "::error::release would change files other than appcast.xml on gh-pages:"; echo "$staged"; exit 1
          fi
          if git -C "$pages" diff --cached --quiet; then
            echo "appcast unchanged; nothing to publish."
          else
            git -C "$pages" commit -m "appcast: publish ${TAG}"
            git -C "$pages" push origin gh-pages
          fi

      - name: Verify the published appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          feedurl="https://bcourbage.github.io/unison-ui-mac/appcast.xml"
          pub="$RUNNER_TEMP/published.xml"
          # Pages deploys asynchronously; a green git push is not proof the feed is
          # served. Poll until the served bytes are BYTE-IDENTICAL to the appcast
          # we generated (a mere filename match could be satisfied by a stale
          # already-signed feed), then cryptographically verify those exact bytes.
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o "$pub" -w '%{http_code}' "$feedurl" || echo 000)
            if [ "$code" = "200" ] && cmp -s "$pub" "$APPCAST_PATH"; then ok=1; break; fi
            echo "waiting for Pages to serve the new feed (attempt $i, http $code)..."; sleep 10
          done
          test "$ok" = "1" || { echo "::error::published feed did not become byte-identical to the generated appcast at ${feedurl}"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 scripts/verify-appcast.py "$pub" --feed-only
          echo "Published appcast verified (byte-identical + signed) at ${feedurl}"

      - name: Verify the client-facing feed (SUFeedURL)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Clients poll SUFeedURL from the built app's Info.plist, not the origin.
          # Derive it from project.yml so this canary can never drift from the app,
          # then poll it until byte-identical to the generated appcast and verify the
          # signature over those exact client-served bytes. When SUFeedURL is the
          # Cloudflare Worker, this also proves the proxy is up and serving the new
          # release (its short cache may lag the origin by up to its TTL). This runs
          # AFTER publication, so it is an automated post-publication canary / incident
          # detector, not a gate; SURequireSignedFeed still rejects any forged content.
          feedurl="$(awk '/^ *SUFeedURL:/{print $2; exit}' project.yml)"
          test -n "$feedurl" || { echo "::error::SUFeedURL not found in project.yml"; exit 1; }
          served="$RUNNER_TEMP/client-served.xml"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o "$served" -w '%{http_code}' "$feedurl" || echo 000)
            if [ "$code" = "200" ] && cmp -s "$served" "$APPCAST_PATH"; then ok=1; break; fi
            echo "waiting for the client feed to serve the new appcast (attempt $i, http $code)..."; sleep 10
          done
          test "$ok" = "1" || { echo "::error::client feed did not become byte-identical to the generated appcast at ${feedurl}"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 scripts/verify-appcast.py "$served" --feed-only
          echo "Client-facing feed verified (byte-identical + signed) at ${feedurl}"

# Cut a GitHub release when a `v*` tag is pushed.
#
# Runs on the macos-26 runner and pins Xcode 26.6 (build 17F113): the native
# Icon Composer app icon (Resources/Unison.icon) only compiles under Xcode 26's
# actool, so an older Xcode would silently ship a .app with a broken/missing
# icon. The toolchain is verified fail-closed below before any build.
#
# Builds the Release configuration, signs it with Developer ID + the hardened
# runtime (inside-out, via scripts/sign-app.sh), notarizes and staples it,
# packages the stapled .app with `ditto`, and attaches the zip to a
# GitHub Release whose notes come from `release-notes/<version>.md` when that
# approved, version-specific file is present, otherwise from the matching
# CHANGELOG section (fallback).
#
# This replaces the manual flow (`make build CONFIG=Release` → `ditto` →
# `gh release create`). The Homebrew cask is NOT bumped here — the tap
# repo's `bump-cask.yml` detects the new release via `brew livecheck`
# daily and opens the bump PR on its own.
#
# Normal use: bump MARKETING_VERSION in project.yml, update CHANGELOG,
# commit, then `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`.
#
# Dry run: Actions tab → Run workflow → pick a tag, leave dry_run=true.
# It builds + packages and uploads the zip as a workflow artifact, but
# does NOT create or modify any Release (so a published asset's bytes —
# and thus the cask's sha256 — are never disturbed).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref to build: a v* tag to publish, or any branch/SHA (e.g. main) for a dry run"
        required: true
      dry_run:
        description: "Build + package only; do not create/modify a Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve ref + version
        id: ver
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          # Real publishes must come from a v* tag. Dry runs may target any
          # ref (e.g. `main`) to test the release build before tagging.
          case "$ref" in
            v*) ;;
            *) if [ "${{ github.event_name }}" = "push" ] || [ "$DRY_RUN" = "false" ]; then
                 echo "::error::ref '$ref' must be a v* tag for a real release"; exit 1
               fi ;;
          esac
          echo "tag=$ref"            >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}"    >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Select and verify Xcode 26.6 (fail closed)
        # The native Icon Composer app icon (Resources/Unison.icon) only
        # compiles under Xcode 26's actool. Pin the exact toolchain and refuse
        # to build with anything else, so a runner-image change that drops or
        # bumps Xcode 26.6 fails the release loudly here instead of silently
        # shipping a .app with a broken/missing icon. Matched exactly against
        # both lines of `xcodebuild -version` (Xcode 26.6 / Build 17F113).
        run: |
          dev="/Applications/Xcode_26.6.app/Contents/Developer"
          if [ ! -d "$dev" ]; then
            echo "::error::Xcode 26.6 not found at $dev"; exit 1
          fi
          sudo xcode-select -s "$dev"
          ver="$(xcodebuild -version)"
          echo "$ver"
          echo "$ver" | grep -qx "Xcode 26.6"          || { echo "::error::expected Xcode 26.6, got: $(echo "$ver" | head -1)"; exit 1; }
          echo "$ver" | grep -qx "Build version 17F113" || { echo "::error::expected build 17F113, got: $(echo "$ver" | sed -n 2p)"; exit 1; }

      - name: Untap aws/tap (runner-image noise)
        # The macOS runner pre-taps `aws/tap`, untrusted under Homebrew's
        # tap-trust gate; it warns on every brew call, including setup-ocaml's
        # below. Untap first so all later brew steps are quiet. `|| true`: a
        # future image without the tap must not fail the release.
        run: brew untap aws/tap || true

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      # Pinned OCaml 5.5.0 via opam — the release binary must link against the
      # same runtime the vendored blob was compiled with (ABI is version-locked).
      # Do not replace with an unversioned `brew install ocaml`.
      - name: Set up OCaml 5.5.0 (pinned)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"

      # setup-ocaml doesn't put the switch's bin on PATH for plain `run:`
      # steps; add it so `ocamlc` resolves in every later step.
      - name: Put the pinned OCaml switch on PATH
        run: echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Verify pinned OCaml
        run: |
          ocamlc -version
          test "$(ocamlc -version)" = "5.5.0"

      - name: Install xcodegen
        # (aws/tap is untapped in an earlier step so this brew call is quiet.)
        run: brew install xcodegen

      - name: Verify the tag matches MARKETING_VERSION
        # Guards against tagging without bumping project.yml (or vice
        # versa) — the About panel / CFBundleShortVersionString would
        # otherwise disagree with the release name. Skipped for dry runs,
        # which may target a branch (e.g. `main`) to test the release build
        # before tagging — there's no version to match yet.
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        run: |
          mv=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$mv" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag version ${{ steps.ver.outputs.version }} != project.yml MARKETING_VERSION $mv"
            exit 1
          fi

      - name: Run tests
        # The tag is usually cut from a green main, but a release is
        # high-stakes — re-verify on the exact tagged tree before shipping.
        run: make test

      - name: Build (Release configuration)
        # Builds ad-hoc (the signing resolver forces ad-hoc for Release/CI); the
        # Developer ID signature is applied by the explicit sign step below.
        run: make build CONFIG=Release

      - name: Import Developer ID signing certificate
        # Import the Developer ID Application cert (a base64 .p12 secret) into an
        # ephemeral keychain and put it first in the search list, so sign-app.sh's
        # `security find-identity` resolves exactly this identity.
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Signing identities visible to codesign:"
          security find-identity -v -p codesigning

      - name: Sign (Developer ID, hardened runtime, inside-out)
        run: ./scripts/sign-app.sh ".build/derived/Build/Products/Release/unison-ui-mac.app"

      - name: Notarize and staple
        # Submit to Apple's notary service with the App Store Connect API key
        # (base64 .p8 + key-id + issuer secrets), fail on anything but Accepted
        # (printing the notary log), then staple the ticket into the bundle so it
        # validates offline on first launch.
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          app=".build/derived/Build/Products/Release/unison-ui-mac.app"
          key="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$zip"
          out="$(xcrun notarytool submit "$zip" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json)"
          echo "$out"
          id="$(echo "$out" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          status="$(echo "$out" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status"
            xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            rm -f "$key"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Package the .app
        id: pkg
        run: |
          app=".build/derived/Build/Products/Release/unison-ui-mac.app"
          test -d "$app" || { echo "::error::built app not found at $app"; exit 1; }
          # Fail loudly if the signature didn't take, and confirm Gatekeeper
          # accepts the notarized+stapled bundle before zipping it for release.
          codesign --verify --deep --strict "$app"
          spctl -a -vvv --type exec "$app"
          zip="unison-ui-mac-${{ steps.ver.outputs.version }}.app.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "Built $zip"
          shasum -a 256 "$zip"

      - name: Resolve release notes
        id: notes
        run: |
          v="${{ steps.ver.outputs.version }}"
          approved="release-notes/${v}.md"
          if [ -s "$approved" ]; then
            # Approved, version-specific release notes take precedence when
            # present. Used verbatim — never rewritten here.
            cp "$approved" notes.md
            echo "Using approved release notes: $approved"
          else
            # Fallback: lines between this version's `## [x.y.z]` header and
            # the next `## [` header in the CHANGELOG.
            awk -v ver="$v" '
              $0 ~ ("^## \\[" ver "\\]") {f=1; next}
              /^## \[/ {f=0}
              f
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "Release $v." > notes.md
              echo "::warning::no approved notes and no CHANGELOG section for $v — using a stub note."
            fi
          fi

      # Dry run (workflow_dispatch with dry_run=true): keep the artifact
      # for inspection, touch no Release.
      - name: Upload artifact (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: ${{ steps.pkg.outputs.zip }}
          retention-days: 7

      # Real publish (tag push, or dispatch with dry_run=false). Create the
      # Release if it doesn't exist; otherwise replace its asset in place.
      - name: Create / update the GitHub Release
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          zip="${{ steps.pkg.outputs.zip }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag exists — replacing its asset."
            gh release upload "$tag" "$zip" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$zip" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file notes.md
          fi

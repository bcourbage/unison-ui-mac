# Continuous integration for unison-ui-mac.
#
# Verifies that the vendored OCaml blob still links against the host
# OCaml runtime, the Swift app still compiles, and the XCTest suite
# still passes on a clean macOS arm64 runner. Intentionally minimal —
# this is a personal-use project, not a fan-out matrix.
#
# Why we don't build the OCaml blob from upstream here:
#   - `vendor/unison-blob-2.54.0-arm64.o` is committed, so `make build`
#     just compiles Swift + links. The 5–10 min OCaml compile only
#     happens via `make vendor-blob`, which is a maintainer workflow.
#   - We do still need an OCaml install because the Swift app links
#     against libasmrun.a / libthreadsnat.a / libunixnat.a /
#     libcamlstrnat.a from it, and includes its headers.
#
# OCaml is PINNED to 5.5.0 via opam (ocaml/setup-ocaml), NOT `brew install
# ocaml` (which follows the latest formula). The vendored blob's runtime ABI
# is version-locked, so linking must use the same 5.5.0 runtime; a silent
# Homebrew bump to a newer OCaml would break the link. `make build` derives
# OCAMLLIBDIR from `ocamlc -where` (the opam switch) and runs
# `check-ocaml-version` as a fail-fast guard.
#
# Trigger surface:
#   - push to main (post-merge confidence + green badge for README)
#   - pull_request (run before review)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual re-runs from the Actions tab without pushing a no-op
  # commit — useful when only the workflow file itself changes.
  workflow_dispatch:

# SF12: declare the least-privilege default token explicitly — this workflow only
# reads the repository (build + test); it never writes.
permissions:
  contents: read

# SF11: XcodeGen is pinned + checksum-verified via the single authority
# scripts/install-xcodegen.sh (shared with release.yml and vendor-blob.yml), so a
# floating `brew install xcodegen` can't change the generated .xcodeproj /
# Resources/Info.plist — both generated from project.yml, the source of truth for
# build settings and Info.plist security keys — between otherwise-identical commits.

jobs:
  test:
    name: Build + test
    # macos-15 is the arm64 runner image as of 2026. macos-14 also
    # works (arm64 since GitHub flipped the default). macos-latest is
    # tempting but it drags us forward on Apple's schedule rather
    # than ours — pin explicitly.
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # No submodules / LFS — the vendored blob lives in the tree.
        # SF12: pinned to a SHA (mutable @v5 tag can be re-pointed).

      - name: Untap aws/tap (runner-image noise)
        # The GitHub-hosted macOS runner image pre-taps `aws/tap`, which is
        # untrusted under Homebrew's tap-trust gate and warns on EVERY brew
        # call — including the ones setup-ocaml makes below. Untap it first so
        # every later brew step is quiet. `|| true`: a future image that drops
        # the tap must not fail the job.
        run: brew untap aws/tap || true

      - name: Show toolchain versions
        # Useful for debugging CI-vs-local discrepancies in failure
        # reports. Cheap; runs in <1 s.
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      # Pinned OCaml 5.5.0 via opam (setup-ocaml manages its own caching).
      # SF7: export the app's macOS deployment target BEFORE setup-ocaml so the
      # OCaml runtime is GENUINELY built for it. setup-ocaml compiles the compiler
      # + runtime from source; with MACOSX_DEPLOYMENT_TARGET set, clang evaluates
      # availability at the target and emits minos-15 runtime objects (post-15
      # APIs weak-imported, not strongly bound). This is the real fix — the app is
      # never relabelled. verify-runtime-minos (run by `make build`) asserts it.
      - name: Export macOS deployment target (from project.yml) for the OCaml build
        run: |
          target="$(awk '/deploymentTarget:/{f=1} f&&/macOS:/{gsub(/[" ]/,""); split($0,a,":"); print a[2]; exit}' project.yml)"
          [ -n "$target" ] || { echo "::error::could not read deploymentTarget macOS from project.yml"; exit 1; }
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"
          echo "OCaml runtime will be built for macOS $target"

      # This is the runtime the vendored blob is linked against; do not
      # replace with an unversioned `brew install ocaml`.
      - name: Set up OCaml 5.5.0 (pinned)
        uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: "5.5.0"
          # Bust any cached switch built before the deployment target was pinned
          # (a stale cache would serve a host-minos runtime and fail
          # verify-runtime-minos). Bump this suffix if the target changes.
          cache-prefix: "v2-macos-deploy-target"

      # setup-ocaml doesn't put the switch's bin on PATH for plain `run:`
      # steps; add it so `ocamlc` (and thus `make`'s `ocamlc -where` /
      # check-ocaml-version) resolves in every later step.
      - name: Put the pinned OCaml switch on PATH
        run: echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Verify pinned OCaml
        run: |
          ocamlc -version
          test "$(ocamlc -version)" = "5.5.0"

      - name: Assert generated files are NOT tracked (clean-checkout precondition)
        # The repository must be self-contained WITHOUT committed generated
        # outputs: neither the generated Resources/Info.plist nor a tracked
        # .xcodeproj may be in the index, and neither should be present in a fresh
        # checkout (the build produces them). Fails closed if either is tracked.
        run: |
          if git ls-files --error-unmatch Resources/Info.plist >/dev/null 2>&1; then
            echo "::error::Resources/Info.plist is tracked — it is generated and must be gitignored"; exit 1
          fi
          if git ls-files '*.xcodeproj' '*.xcodeproj/**' | grep -q .; then
            echo "::error::a .xcodeproj is tracked — it is generated and must be gitignored"; exit 1
          fi
          test ! -e unison-ui-mac.xcodeproj || { echo "::error::fresh checkout already contains a .xcodeproj"; exit 1; }
          test ! -e Resources/Info.plist   || { echo "::error::fresh checkout already contains Resources/Info.plist"; exit 1; }
          echo "clean-checkout precondition ok: no tracked/committed generated outputs"

      - name: Install pinned + SHA-256-verified XcodeGen
        # SF11: single authority for the pinned version + checksum. XcodeGen
        # regenerates the .xcodeproj AND Resources/Info.plist from project.yml
        # (the source of truth for build settings and Sparkle security keys); a
        # floating `brew install xcodegen` could change them between identical
        # commits. Same script release.yml and vendor-blob.yml use.
        run: ./scripts/install-xcodegen.sh

      - name: Generation contract (determinism)
        # Proves `make generate` creates an absent plist and REPLACES a stale one
        # with the project.yml values — an old ignored local copy can never
        # survive as build input.
        run: make check-generate-contract

      - name: XcodeGen install is fail-closed
        # Proves a repository-local XcodeGen with a valid-version binary but
        # missing SettingPresets is rejected by --verify and repaired by
        # `make generate` before generation (a missing-presets install silently
        # emits a different project).
        run: make check-xcodegen-install

      - name: Check signing resolver matrix
        # Pure-shell gate (no Xcode/OCaml needed): the signing resolver matrix
        # in scripts/test-resolve-signing.sh (24 cases, 38 assertions)
        # exercises resolve-signing.sh and the select-signing.sh Makefile
        # adapter — manual-override pairing, keychain verification, hostile
        # identity values, the fail-loud contract on resolver error / malformed
        # output, and the identity/team pairing contract. Runs before Build so
        # a regression in the signing policy fails fast and independently of
        # the (much slower) app build.
        run: make check-signing

      - name: Check appcast signature verifier
        # Pure-shell gate (no Xcode/OCaml/network): runs the per-enclosure EdDSA
        # signature verifier against committed fixtures, including the regression
        # case where a signed release-notes link must not mask an unsigned
        # enclosure. Guards the release tooling from silently publishing an
        # appcast that would break updates for installed clients.
        run: make check-appcast

      - name: Check sparkle-appcast output-path resolution
        # Pure-shell gate: sparkle-appcast.sh validates the appcast that
        # generate_appcast actually wrote, for separated and joined -o/--output-path.
        run: make check-sparkle-output-path

      - name: Check sign-app guards
        # Pure-shell gate: sign-app.sh's fail-fast presence + identity guards
        # (required Sparkle components; explicit identity must be Developer ID).
        run: make check-sign-app

      - name: Check the `unison` launcher
        # Pure cc gate (no Xcode/OCaml/signing): compiles Sources/CLTool/cltool.c
        # against a throwaway bundle id into a fake bundle and exercises it via a
        # PATH symlink, by direct path, copied out (fails closed), and against a
        # bundle with no app executable.
        run: make check-cltool

      - name: Check install.sh hardening
        # Pure-shell gate (no Xcode/OCaml/sudo): install.sh's SF8–SF10 behaviour —
        # Release-only selection, staged-then-swap with rollback, and a verified
        # quarantine strip — via install.sh's test seams.
        run: make check-install

      - name: Check bundle-floor verifier
        # Pure-shell gate (clang fixtures, no Xcode/OCaml): the SF7
        # verify-bundle-minos.sh two-tier rule — our own binaries == the
        # deployment target, nothing exceeds it, fail-closed on an empty bundle.
        # Runs before Build so a regression in the deployment gate fails fast.
        run: make check-bundle-minos

      - name: Check release-notes HTML converter
        # Pure-Python (stdlib) gate: the release-notes markdown -> Sparkle
        # "What's New" HTML-fragment converter, including the fragment invariant
        # generate_appcast relies on to embed the notes inline.
        run: make check-release-notes

      - name: Check appcast cryptographic verifier
        # Exercises verify-appcast.py against the pinned sign_update (Sparkle's
        # own verifier — no third-party crypto lib): a signed feed + archive pass;
        # a tampered archive, poisoned feed, wrong key, and out-of-prefix URL fail
        # closed. Fetches the checksum-pinned Sparkle tools (same SHA-256 as the
        # release job and docs/sparkle-updates.md).
        env:
          SPARKLE_SHA256: "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
        run: |
          tools="$RUNNER_TEMP/sparkle-tools"; mkdir -p "$tools"
          curl -fL -o "$tools/s.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          echo "${SPARKLE_SHA256}  $tools/s.tar.xz" | shasum -a 256 -c -
          tar -xf "$tools/s.tar.xz" -C "$tools"
          SPARKLE_BIN="$tools/bin" make check-verify-appcast

      - name: Build
        # `make build` regenerates the xcodeproj, builds the app for
        # Debug, and stops short of running tests. Catches Swift
        # compile errors with a smaller failure surface than `make
        # test`, so a broken build shows up clearly in CI logs.
        #
        # SF7 end-to-end gate: capture the build log and fail on ANY
        # deployment-version linker warning. `make build` already runs
        # verify-runtime-minos (the OCaml runtime was genuinely built for the
        # target) as a prerequisite; this catches any NEW source of a
        # newer-macOS object slipping into the link.
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log
          if grep -q "was built for newer" build.log; then
            echo "::error::deployment-version linker warnings present — a Mach-O is built for a newer macOS than the baseline (SF7)"
            grep "was built for newer" build.log | sort -u | head
            exit 1
          fi

      - name: Verify macOS deployment baseline
        # Assert the finished Debug bundle's Mach-O floors: our own binaries are
        # exactly the deployment target, and no embedded binary (incl. Sparkle)
        # exceeds it. This runner IS macos-15, so a green build+test here is the
        # app genuinely building AND running its full XCTest suite on the baseline OS.
        run: make verify-bundle-minos

      - name: CLI smoke (launcher + headless engine on the built bundle)
        # XCTest and UNISON_UI_SMOKE take the graphical branch and never reach
        # the command-line path. This runs the bundled `unison` launcher through
        # a symlink and the engine's stdin/stdout server transport (the app in
        # text mode as client, the same bundle as server through an ssh
        # stand-in) against the Debug bundle just built. The release pipeline
        # runs the same script on macOS 15 against the release bytes.
        run: ./scripts/smoke-cli.sh .build/derived/Build/Products/Debug/unison-ui-mac.app

      - name: Verify Info.plist critical values (generated + built app)
        # Two complementary layers, on the generated plist AND the built .app:
        #  - propagation (verify-plist-keys): plist matches project.yml (the
        #    source of truth) — bundle id, executable, min-os, version/build, SU keys;
        #  - policy (verify-plist-policy): hard-coded security invariants (exact
        #    production SUFeedURL, SURequireSignedFeed/SUVerifyUpdateBeforeExtraction
        #    true, SUSignedFeedFailureExpirationInterval 0, bundle id, macOS floor,
        #    EdDSA key shape) that a weakened project.yml would fail even though
        #    propagation still passes.
        run: |
          app=.build/derived/Build/Products/Debug/unison-ui-mac.app
          make check-plist-keys
          make check-plist-policy
          ./scripts/verify-plist-keys.sh   --app "$app"
          ./scripts/verify-plist-policy.sh --app "$app"

      - name: Clean-worktree proof (generation + build produced only ignored outputs)
        # After generating and building, `git status` must be clean: every output
        # (the .xcodeproj and Resources/Info.plist, plus intentionally-ignored
        # byproducts like .tools/, _opam/, .build/, and build.log) is gitignored.
        # A non-empty status means some produced file escaped .gitignore.
        run: |
          test -d unison-ui-mac.xcodeproj || { echo "::error::build did not produce the generated .xcodeproj"; exit 1; }
          test -f Resources/Info.plist    || { echo "::error::build did not produce Resources/Info.plist"; exit 1; }
          if [ -n "$(git status --short)" ]; then
            echo "::error::working tree is dirty after generate+build — a generated output is not ignored:"
            git status --short
            exit 1
          fi
          echo "clean-worktree proof ok: generate + build left git status clean (only ignored outputs produced)"

      - name: Run tests
        # 286 tests at the v0.1.0 baseline. Should run in ~1 s on the
        # M-series runner; the wall clock here will be Xcode startup
        # (~10–20 s) plus the test execution.
        run: make test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xcresult-bundle
          path: .build/derived/Logs/Test/*.xcresult
          # Don't keep these forever — they're large and only useful
          # for the immediate failure investigation.
          retention-days: 7

  site:
    name: Build product site
    # Pure-Python static-site build; no Xcode toolchain, so a cheap ubuntu
    # runner. This job VALIDATES the site build on every PR and push — it never
    # deploys (deployment lives in pages.yml, gated on push to main only).
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned, hash-locked Markdown
        # Hash-locked in lockstep with pages.yml so a swapped distribution cannot
        # be substituted and the rendered HTML is reproducible between this
        # validation and the actual deploy.
        run: python -m pip install --require-hashes -r requirements-site.txt

      - name: Unit tests
        run: python scripts/test-build-site.py

      - name: Build the site
        run: python scripts/build-site.py _site

      - name: Validate the build (SEO + appcast safety)
        run: |
          set -euo pipefail
          # The build must NEVER emit appcast.xml: the Sparkle feed lives on the
          # same Pages host and is owned solely by the release workflow.
          if [ -e _site/appcast.xml ]; then
            echo "::error::site build emitted appcast.xml — the feed must never come from the site build"; exit 1
          fi
          for f in _site/index.html _site/install/index.html _site/faq/index.html \
                   _site/manual/index.html _site/credits/index.html _site/style.css \
                   _site/sitemap.xml _site/.nojekyll; do
            test -f "$f" || { echo "::error::missing built file: $f"; exit 1; }
          done
          # Every JSON-LD block must be valid JSON, and no fabricated rating.
          python - <<'PY'
          import re, json, glob, sys
          for path in glob.glob("_site/**/index.html", recursive=True):
              html = open(path, encoding="utf-8").read()
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S):
                  obj = json.loads(block)  # raises on invalid JSON
                  if "aggregateRating" in obj or "review" in obj:
                      sys.exit(f"::error::fabricated rating in JSON-LD at {path}")
          print("site build validated: no appcast.xml, all pages present, JSON-LD valid")
          PY

      - name: Check internal links
        run: python scripts/check-site-links.py _site

      - name: Upload the built site for preview
        # Lets the site be previewed without a local build: download this artifact
        # from the run, unzip it, and serve it (e.g. `python3 -m http.server` in the
        # folder). Serve rather than open via file:// so the directory-style links
        # (/install/, /faq/) resolve.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-site
          path: _site
          include-hidden-files: true   # keep .nojekyll
          retention-days: 14
